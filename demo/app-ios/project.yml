name: HybridDemo

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  HybridDemo:
    type: application
    platform: iOS
    sources:
      - path: HybridDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hybriddemo
        INFOPLIST_FILE: HybridDemo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
