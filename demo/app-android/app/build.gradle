plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.hybriddemo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.hybriddemo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    flavorDimensions = ["shell"]
    productFlavors {
        production {
            dimension "shell"
            // Normal package: no debug plugin, no bundle-sync code.
        }
        devShell {
            dimension "shell"
            applicationIdSuffix ".devshell"
            versionNameSuffix "-devshell"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Only the devShell flavor gets the bundle-sync plugin. Production never
    // has this module on its compile/runtime classpath.
    devShellImplementation project(":web-debug-plugin")
}
